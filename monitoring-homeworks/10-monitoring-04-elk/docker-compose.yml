version: '3.8'

services:
  es-hot:
    image: elasticsearch:8.7.0
    container_name: es-hot
    environment:
      - node.name=es-hot
      - cluster.name=es-docker-cluster
      - discovery.seed_hosts=es-hot,es-warm
      - cluster.initial_master_nodes=es-hot,es-warm
      - node.roles=master,data_content,data_hot
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - "http.host=0.0.0.0"
      - xpack.security.enabled=false
    volumes:
      - data-hot:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - elastic
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  es-warm:
    image: elasticsearch:8.7.0
    container_name: es-warm
    environment:
      - node.name=es-warm
      - cluster.name=es-docker-cluster
      - discovery.seed_hosts=es-hot,es-warm
      - cluster.initial_master_nodes=es-hot,es-warm
      - node.roles=master,data_warm
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - "http.host=0.0.0.0"
      - xpack.security.enabled=false
    volumes:
      - data-warm:/usr/share/elasticsearch/data
    networks:
      - elastic
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  logstash:
    image: logstash:8.7.0
    container_name: logstash
    environment:
      - "LS_JAVA_OPTS=-Xms512m -Xmx512m"
      - http.host=0.0.0.0
    volumes:
      - ./configs/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
      - "5046:5046"
    networks:
      - elastic
    depends_on:
      - es-hot
      - es-warm

  kibana:
    image: kibana:8.7.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://es-hot:9200
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    networks:
      - elastic
    depends_on:
      - es-hot
      - es-warm

  filebeat:
    image: elastic/filebeat:8.7.0
    container_name: filebeat
    user: root
    command: ["--strict.perms=false"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./configs/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    networks:
      - elastic
    depends_on:
      - logstash
  
  some_app:
    image: python:3.9-slim
    container_name: some_app
    restart: always
    command:
      - python3
      - -u
      - -c
      - |
        import time, json, random, datetime
        levels = ["INFO", "WARNING", "ERROR"]
        messages = ["User auth success", "Database query executed", "Connection timed out", "Cache invalidated"]
        while True:
            data = {
                "timestamp": datetime.datetime.utcnow().isoformat(),
                "level": random.choice(levels),
                "message": random.choice(messages),
                "status_code": random.choice([200, 201, 400, 404, 500])
            }
            print(json.dumps(data), flush=True)
            time.sleep(2)
    networks:
      - elastic

volumes:
  data-hot:
  data-warm:

networks:
  elastic:
    driver: bridge
