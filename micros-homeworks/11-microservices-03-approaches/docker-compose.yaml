volumes:
  data:
  prometheus-data:
  grafana_data:
  es_data:

services:
  storage:
    image: cgr.dev/chainguard/minio:latest
    command: server /data
    restart: always
    expose: 
      - 9000
    environment:
      MINIO_ROOT_USER: ${Storage_AccessKey:-storage}
      MINIO_ROOT_PASSWORD: ${Storage_Secret:-qwerty123456}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - data:/data

  createbuckets:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      - storage
    restart: on-failure
    entrypoint: > 
      /bin/sh -c "
      echo 'Waiting for MinIO storage...' &&
      until mc alias set storage http://storage:9000 ${Storage_AccessKey:-storage} ${Storage_Secret:-qwerty123456} 2>/dev/null || /usr/bin/mc config host add storage http://storage:9000 ${Storage_AccessKey:-storage} ${Storage_Secret:-qwerty123456} 2>/dev/null; do
        sleep 2;
      done &&
      mc mb --ignore-existing storage/${Storage_Bucket:-images} &&
      (mc anonymous set download storage/${Storage_Bucket:-images} || mc policy set download storage/${Storage_Bucket:-images}) &&
      exit 0;
      "

  uploader:
    build: ./uploader
    depends_on:
      - storage
      - createbuckets
    expose: 
      - 3000
    environment:
      PORT: 3000
      S3_HOST: storage
      S3_PORT: 9000
      S3_ACCESS_KEY: ${Storage_AccessKey:-storage}
      S3_ACCESS_SECRET: ${Storage_Secret:-qwerty123456}
      S3_BUCKET: ${Storage_Bucket:-images}
  
  security:
    build: ./security
    expose: 
      - 3000
    environment:
      PORT: 3000

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "8080:8080"
    depends_on:
      - storage
      - uploader
      - security

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: elasticsearch
    restart: always
    environment:
      - node.name=elasticsearch
      - cluster.name=es-cluster
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=qwerty123456
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  es-setup:
    image: curlimages/curl:latest
    container_name: es-setup
    depends_on:
      - elasticsearch
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Elasticsearch...' &&
      until curl -s -f -u elastic:qwerty123456 http://elasticsearch:9200/_cluster/health; do
        sleep 2;
      done &&
      echo 'Creating admin user with superuser role...' &&
      curl -s -u elastic:qwerty123456 -X POST 'http://elasticsearch:9200/_security/user/admin' -H 'Content-Type: application/json' -d '{\"password\": \"qwerty123456\", \"roles\": [\"superuser\"]}' &&
      echo 'Admin user ready!';
      "

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.9
    container_name: kibana
    restart: always
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: qwerty123456
    ports:
      - "8081:5601"
    depends_on:
      - elasticsearch

  vector:
    image: timberio/vector:0.34.0-alpine
    container_name: vector
    restart: always
    user: "0:0"
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
    depends_on:
      - elasticsearch
  
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.0.3
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=qwerty123456
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "8082:3000"
    depends_on:
      - prometheus
