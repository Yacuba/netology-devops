---
- name: Install Clickhouse
  hosts: clickhouse
  tags:
    - clickhouse
  handlers:
    - name: Start clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
  tasks:
    - name: Download Clickhouse packages
      block:
        - name: Get clickhouse distrib
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/{{ item }}-{{ clickhouse_version }}.noarch.rpm"
            dest: "/tmp/{{ item }}-{{ clickhouse_version }}.rpm"
            mode: "0644"
          loop: "{{ clickhouse_packages }}"
      rescue:
        - name: Get clickhouse static distrib
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/clickhouse-common-static-{{ clickhouse_version }}.x86_64.rpm"
            dest: "/tmp/clickhouse-common-static-{{ clickhouse_version }}.rpm"
            mode: "0644"

    - name: Install clickhouse packages
      become: true
      ansible.builtin.dnf:
        name:
          - "/tmp/clickhouse-common-static-{{ clickhouse_version }}.rpm"
          - "/tmp/clickhouse-client-{{ clickhouse_version }}.rpm"
          - "/tmp/clickhouse-server-{{ clickhouse_version }}.rpm"
        disable_gpg_check: true
      notify: Start clickhouse service

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Create database
      ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc != 82
      changed_when: create_db.rc == 0
      retries: 5
      delay: 2
      until: create_db is not failed

- name: Install Vector
  hosts: vector
  tags:
    - vector
  handlers:
    - name: Restart Vector service
      become: true
      ansible.builtin.service:
        name: vector
        state: restarted
        daemon_reload: true
  tasks:
    - name: Create required directories for Vector
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ vector_config_dir }}"
        - "{{ vector_data_dir }}"
        - "/opt/vector"

    - name: Download Vector archive
      ansible.builtin.get_url:
        url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-musl.tar.gz"
        dest: "/tmp/vector-{{ vector_version }}-x86_64-unknown-linux-musl.tar.gz"
        mode: "0644"

    - name: Extract Vector archive
      become: true
      ansible.builtin.unarchive:
        src: "/tmp/vector-{{ vector_version }}-x86_64-unknown-linux-musl.tar.gz"
        dest: "/opt/vector"
        remote_src: true
        extra_opts:
          - "--strip-components=2"

    - name: Create symlink for Vector binary
      become: true
      ansible.builtin.file:
        src: "/opt/vector/bin/vector"
        dest: "/usr/bin/vector"
        state: link
        mode: "0755"

    - name: Deploy Vector systemd service
      become: true
      ansible.builtin.template:
        src: vector.service.j2
        dest: /etc/systemd/system/vector.service
        mode: "0644"
      notify: Restart Vector service

    - name: Deploy Vector configuration
      become: true
      ansible.builtin.template:
        src: vector.yaml.j2
        dest: "{{ vector_config_dir }}/vector.yaml"
        mode: "0644"
      notify: Restart Vector service

    - name: Ensure Vector service is started and enabled
      become: true
      ansible.builtin.service:
        name: vector
        state: started
        enabled: true

- name: Install Lighthouse
  hosts: lighthouse
  tags:
    - lighthouse
  handlers:
    - name: Reload Nginx service
      become: true
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Restart Nginx service
      become: true
      ansible.builtin.service:
        name: nginx
        state: restarted
  tasks:
    - name: Set SELinux to permissive
      become: true
      ansible.builtin.command: setenforce 0
      register: selinux_result
      changed_when: false
      failed_when: false

    - name: Install EPEL repository
      become: true
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: Install Nginx and git
      become: true
      ansible.builtin.dnf:
        name:
          - nginx
          - git
        state: present

    - name: Create web root directory for Lighthouse
      become: true
      ansible.builtin.file:
        path: "{{ lighthouse_dir }}"
        state: directory
        mode: "0755"
        owner: nginx
        group: nginx

    - name: Download Lighthouse archive
      ansible.builtin.get_url:
        url: "{{ lighthouse_url }}"
        dest: "/tmp/lighthouse-{{ lighthouse_version }}.tar.gz"
        mode: "0644"

    - name: Extract Lighthouse archive
      become: true
      ansible.builtin.unarchive:
        src: "/tmp/lighthouse-{{ lighthouse_version }}.tar.gz"
        dest: "{{ lighthouse_dir }}"
        remote_src: true
        extra_opts:
          - "--strip-components=1"
        owner: nginx
        group: nginx

    - name: Apply SELinux file context to Lighthouse web root
      become: true
      ansible.builtin.file:
        path: "{{ lighthouse_dir }}"
        setype: httpd_sys_content_t
        recurse: true
        state: directory

    - name: Deploy Nginx main configuration
      become: true
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        mode: "0644"
      notify: Reload Nginx service

    - name: Deploy Nginx site configuration for Lighthouse
      become: true
      ansible.builtin.template:
        src: lighthouse.conf.j2
        dest: /etc/nginx/conf.d/lighthouse.conf
        mode: "0644"
      notify: Reload Nginx service

    - name: Ensure Nginx service is started and enabled
      become: true
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
