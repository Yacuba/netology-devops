apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netology-app.fullname" . }}-backend
  labels:
    {{- include "netology-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            - name: HTTP_PORT
              value: {{ .Values.backend.env.httpPort | quote }}
          ports:
            - containerPort: {{ .Values.backend.env.httpPort }}
              name: http
