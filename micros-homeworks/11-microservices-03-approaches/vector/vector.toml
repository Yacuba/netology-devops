data_dir = "/var/lib/vector"

[sources.docker_source]
type = "docker_logs"
exclude_containers = ["vector", "elasticsearch", "kibana", "es-setup"]

[transforms.format_logs]
type = "remap"
inputs = ["docker_source"]
source = '''
."@timestamp" = .timestamp
del(.label)
'''

[sinks.elasticsearch_sink]
type = "elasticsearch"
inputs = ["format_logs"]
endpoints = ["http://elasticsearch:9200"]
mode = "bulk"
bulk.index = "vector-%Y.%m.%d"
api_version = "v7"

[sinks.elasticsearch_sink.healthcheck]
enabled = false

[sinks.elasticsearch_sink.auth]
strategy = "basic"
user = "elastic"
password = "qwerty123456"