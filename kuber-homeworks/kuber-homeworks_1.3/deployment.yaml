apiVersion: apps/v1
kind: Deployment
metadata:
  name: netology-deployment
  labels:
    app: web-multitool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-multitool
  template:
    metadata:
      labels:
        app: web-multitool
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
              name: nginx-port
        - name: multitool
          image: wbitt/network-multitool
          env:
            - name: HTTP_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: multitool-port
