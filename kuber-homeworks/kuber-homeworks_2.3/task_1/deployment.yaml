apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: default
  labels:
    app: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.25.4
        ports:
        - name: http
          containerPort: 80
        volumeMounts:
        - name: web-content
          mountPath: /usr/share/nginx/html
      - name: multitool
        image: wbitt/network-multitool:alpine-extra
        env:
        - name: HTTP_PORT
          valueFrom:
            configMapKeyRef:
              name: web-config
              key: HTTP_PORT
        - name: HTTPS_PORT
          valueFrom:
            configMapKeyRef:
              name: web-config
              key: HTTPS_PORT
        ports:
        - name: http-multitool
          containerPort: 8080
      volumes:
      - name: web-content
        configMap:
          name: web-config
          items:
          - key: index.html
            path: index.html
