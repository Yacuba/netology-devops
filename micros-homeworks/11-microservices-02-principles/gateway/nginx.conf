events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    upstream security_service {
        server security:3000;
    }

    upstream uploader_service {
        server uploader:3000;
    }

    upstream minio_service {
        server storage:9000;
    }

    server {
        listen 80;
        listen 8080;
        server_name localhost;

        # внутренний subrequest проверки токена
        location = /_auth_verify {
            internal;
            proxy_pass http://security_service/v1/token/validation;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # регистрация пользователя: POST /v1/register -> security POST /v1/user (анонимный)
        location = /v1/register {
            proxy_pass http://security_service/v1/user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # получение токена: POST /v1/token и POST /token -> security POST /v1/token (анонимный)
        location = /v1/token {
            proxy_pass http://security_service/v1/token;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Content-Type $http_content_type;
        }

        location = /token {
            proxy_pass http://security_service/v1/token;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Content-Type $http_content_type;
        }

        # инфо о пользователе: GET /v1/user -> security GET /v1/user (с проверкой токена)
        location = /v1/user {
            auth_request /_auth_verify;
            proxy_pass http://security_service/v1/user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # загрузка файла: POST /v1/upload и POST /upload -> uploader POST /v1/upload (с проверкой токена)
        location = /v1/upload {
            auth_request /_auth_verify;
            proxy_pass http://uploader_service/v1/upload;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Content-Type $http_content_type;
        }

        location = /upload {
            auth_request /_auth_verify;
            proxy_pass http://uploader_service/v1/upload;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Content-Type $http_content_type;
        }

        # получение картинки с авторизацией: GET /v1/user/{image} -> minio GET /images/{image}
        location ~ ^/v1/user/(.+)$ {
            auth_request /_auth_verify;
            proxy_pass http://minio_service/images/$1;
            proxy_set_header Host storage:9000;
        }

        # прямой доступ к сохраненным изображениям: GET /images/{image}
        location /images/ {
            proxy_pass http://minio_service/images/;
            proxy_set_header Host storage:9000;
        }
    }
}